<script id="ch104/14">

    // 1. 获取输入并解析
  const line = prompt("请输入重量和是否加急，以空格分隔");
  const parts = line.trim().split(' ');
  const weight = parseInt(parts[0]);
  const isUrgent = parts[1];

  // 2. 计算基本邮费
  let fee = 8; // 1000克以内基本费8元

  if (weight > 1000) {
      const overWeight = weight - 1000;
      // 关键：Math.ceil 实现"不足500克按500克计算"的向上取整
      const extraUnits = Math.ceil(overWeight / 500);
      fee += extraUnits * 4;
  }

  // 3. 判断是否加急
  if (isUrgent === 'y') {
      fee += 5;
  }

  // 4. 输出整数结果
  console.log(fee);
</script>
